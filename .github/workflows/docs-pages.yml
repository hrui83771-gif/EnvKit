name: docs-pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '页头显示的版本号（留空则取 ref 名）'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 在线版必须用 exe 里那份产物，否则文档会悄悄分叉。
      - name: Verify embedded assets are in sync
        run: python tools/web_build.py --check
      # 分节页（/s/<id>/）是从索引生成的：索引落后于 docs.html 时，
      # 站点会静默少一页、sitemap 也收不到。这道先拦。
      - name: Verify docs index is in sync
        run: python tools/docs_index.py --check
      - name: Build static docs site
        run: python tools/docs_site.py --version "${{ inputs.version || github.ref_name }}" --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
