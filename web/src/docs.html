<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>EnvKit · 使用文档</title>
<style>
/* EnvKit 使用文档：自包含独立页，不引用 app.css，也不依赖主界面的任何 JS。
   与主控制台同色系（#faf8f5 纸白 / #4a6fa5 蓝），但排版按文档站重做：
   封面 → 三栏正文 → 右目录联动，宽屏阅读、窄屏单列、打印去壳。 */
:root{
  --bg:#faf8f5;--paper:#fff;--ink:#2f3742;--sub:#4a5a6e;--muted:#7d8794;
  --line:#e6e1d8;--line2:#f0ece4;--brand:#4a6fa5;--brand2:#3a5d8f;
  --brandbg:#eef3fa;--warn:#C9A15C;--warnbg:#fbf5e9;
  --danger:#B05652;--dangerbg:#fcf0ed;--ok:#5C8A6B;--okbg:#eef6f0;
  --shadow:0 1px 2px rgba(74,111,165,.06),0 8px 24px rgba(74,111,165,.04);
  --onbrand:#fff;--herobg:rgba(255,255,255,.72);
}
/* 暗色：只重定义变量，不改结构。值按浅色那套语义一一对应，
   保证「纸白背景/卡片/描边/次级文字」在暗色下仍是同一套层级关系。 */
body[data-theme="dark"]{
  --bg:#161c26;--paper:#1f2733;--ink:#e4e9f0;--sub:#b6c2d1;--muted:#8d9aab;
  --line:#334052;--line2:#2a3544;--brand:#7fa6d8;--brand2:#a9c6e8;
  --brandbg:#26354a;--warn:#d9b877;--warnbg:#3b3323;
  --danger:#d98a84;--dangerbg:#402b2a;--ok:#83b795;--okbg:#253a2d;
  --shadow:0 1px 2px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.18);
  --onbrand:#161c26;--herobg:rgba(31,39,51,.82);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background-image:radial-gradient(circle at 12% 8%,rgba(74,111,165,.045),transparent 42%),
                   radial-gradient(circle at 88% 4%,rgba(201,161,92,.045),transparent 38%);
}
a{color:var(--brand2);text-decoration:none}
a:hover{text-decoration:underline}
button,input{font:inherit;color:inherit}

/* 顶部阅读进度 */
#prog{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--brand),#7fa3cd);
  z-index:60;transition:width .12s linear}

/* 封面 */
.hero{border-bottom:1px solid var(--line);background:var(--herobg);backdrop-filter:blur(8px)}
.hero-in{max-width:1360px;margin:0 auto;padding:26px 24px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:46px;height:46px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#5b7fb4,#3f628f);color:#fff;font-weight:700;font-size:24px;
  box-shadow:0 3px 10px rgba(63,98,143,.24)}
.brand h1{font-size:21px;line-height:1.25;margin:0;letter-spacing:.3px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.hero-side{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver{font:11.5px/1 Consolas,Monaco,monospace;color:var(--muted);background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:7px 11px;white-space:nowrap}
.hbtn{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;
  color:var(--sub);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.hbtn:hover{border-color:var(--brand);background:var(--brandbg);text-decoration:none}
.hbtn.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hbtn.icon svg{display:block;width:15px;height:15px}
.hbtn.primary{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.hbtn.primary:hover{background:var(--brand2);border-color:var(--brand2)}
/* 手机端目录抽屉的把手与遮罩：桌面不显示 */
.toc-btn{display:none}
.toc-mask{position:fixed;inset:0;background:rgba(22,28,38,.42);z-index:48}
.toc-mask[hidden]{display:none}

/* 三栏 */
.layout{display:grid;grid-template-columns:246px minmax(0,780px) 196px;gap:26px;
  max-width:1360px;margin:0 auto;padding:26px 24px 90px;align-items:start}
.side,.toc{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;scrollbar-width:thin}
.search{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;margin-bottom:12px}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13px}
.search input::placeholder{color:var(--muted)}
.search kbd{font:10.5px/1.5 Consolas,monospace;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;background:var(--bg)}
.grp{padding:11px 8px 4px;font-size:10.5px;letter-spacing:.9px;color:var(--muted);font-weight:700;text-transform:uppercase}
.tree button{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  border-radius:8px;padding:6px 10px 6px 12px;font-size:13px;color:var(--sub);position:relative}
.tree button:hover{background:var(--line2);color:var(--ink)}
.tree button.on{background:var(--brandbg);color:var(--brand2);font-weight:600}
.tree button.on:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;
  background:var(--brand);border-radius:3px}
.tree .empty{padding:14px 10px;color:var(--muted);font-size:12.5px}
/* hidden 属性要压过移动端 .tree{display:flex}，否则搜索时目录和结果会同时露出来 */
.tree[hidden],.hits[hidden]{display:none!important}
.gc{display:inline-block;min-width:16px;text-align:center;font:10px/14px Consolas,monospace;color:var(--muted);background:var(--line2);border-radius:7px;padding:0 4px;margin-left:4px}
.side-foot{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:11.5px;color:var(--muted)}
.side-foot a{display:block;padding:3px 0}

/* 正文 */
.main{min-width:0}
.lead{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.lead b{color:var(--brand2)}
.lead p{margin:6px 0 0;color:var(--sub);font-size:13px}
/* 分页阅读：正文一次只渲染一节，面包屑补「在哪一组」的位置感 */
.crumb{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:11.5px;color:var(--muted)}
.crumb .sep{color:var(--muted)}
.crumb b{font-weight:600;color:var(--brand2)}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 26px 24px;
  margin-bottom:16px;box-shadow:var(--shadow);scroll-margin-top:16px}
.sec>h2{margin:0 0 14px;font-size:19px;line-height:1.4;display:flex;align-items:center;gap:10px;
  padding-bottom:11px;border-bottom:1px solid var(--line2)}
.num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--brandbg);color:var(--brand2);
  font:600 12px/26px Consolas,monospace;text-align:center}
.sec p{margin:9px 0;color:var(--sub);font-size:13.5px;line-height:1.9}
.sec ul,.sec ol{margin:9px 0;padding-left:22px;color:var(--sub);font-size:13.5px;line-height:1.85}
.sec li{margin:4px 0;padding-left:2px}
.sec li::marker{color:var(--brand)}
.sec h3{margin:20px 0 8px;font-size:14.5px;color:var(--ink);scroll-margin-top:18px;
  display:flex;align-items:center;gap:7px}
.sec h3:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);flex:none}

.note{margin:13px 0;padding:10px 14px;border-radius:0 10px 10px 0;border-left:3px solid var(--brand);
  background:var(--brandbg);color:var(--sub);font-size:13px;line-height:1.8}
.note.warn{border-left-color:var(--warn);background:var(--warnbg)}
.note.danger{border-left-color:var(--danger);background:var(--dangerbg)}
.note.ok{border-left-color:var(--ok);background:var(--okbg)}
.note b{color:var(--ink)}

.code{position:relative;background:var(--line2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin:12px 0}
.code pre{margin:0;white-space:pre-wrap;word-break:break-all;font:12.5px/1.75 Consolas,Monaco,monospace;color:var(--sub)}
.cp{position:absolute;right:8px;top:7px;background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:2px 9px;font-size:11px;color:var(--sub);cursor:pointer}
.cp:hover{border-color:var(--brand);color:var(--brand2)}

.steps{list-style:none;margin:14px 0;padding:0;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:10px 14px 10px 46px;margin:8px 0;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--sub);font-size:13.5px}
.steps li:before{content:counter(st);position:absolute;left:12px;top:11px;width:22px;height:22px;
  border-radius:50%;background:var(--brand);color:var(--onbrand);text-align:center;line-height:22px;font:600 11px/22px Consolas,monospace}

.tbl{width:100%;border-collapse:collapse;margin:13px 0;font-size:12.5px}
.tbl th{text-align:left;padding:8px 10px;background:var(--line2);color:var(--sub);font-weight:600;
  border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--sub);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl code{font:11.5px Consolas,monospace;background:var(--line2);border-radius:4px;padding:1px 5px;color:var(--brand2)}
.xlink{margin:14px 0 2px;font-size:12.5px;color:var(--muted)}
.xlink a{color:var(--brand2);text-decoration:none;border-bottom:1px dashed var(--brand)}
.xlink a:hover{border-bottom-style:solid}
.tbl td:first-child{white-space:nowrap}

/* 搜索结果：命中片段列表，替换目录显示 */
.hits{margin-bottom:8px;min-width:0}
.hits .hit{display:block;width:100%;max-width:100%;min-width:0;overflow:hidden;text-align:left;
  border:0;background:transparent;cursor:pointer;padding:8px 10px;border-radius:8px;border-left:2px solid transparent}
.hits .hit:hover,.hits .hit.sel{background:var(--brandbg);border-left-color:var(--brand2)}
.hits .hit[hidden],.hits .hit-more[hidden]{display:none}
.hits .hit-t{display:block;font-size:12.5px;color:var(--ink);font-weight:600;line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hits .hit-p{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.55;
  max-height:3.2em;overflow:hidden}
.hits .hit-where{font-size:10.5px;color:var(--brand2);font-weight:400;margin-left:4px}
.hits mark{background:var(--warnbg);color:var(--ink);border-radius:2px;padding:0 1px}
.hits .none{padding:14px 10px;color:var(--muted);font-size:12.5px}
.hits .hit-more{font-size:11px;color:var(--brand2);padding:2px 10px 6px;border:0;background:transparent;cursor:pointer}
.hits .hit-more:hover{text-decoration:underline}

/* 节标题上的锚点按钮：hover 才显形，点了复制可分享链接 */
.sec>h2{position:relative}
.lk{margin-left:auto;flex:none;border:1px solid transparent;background:transparent;color:var(--muted);
  font:600 14px/1 Consolas,monospace;border-radius:6px;padding:3px 7px;cursor:pointer;opacity:0;
  transition:opacity .12s}
.sec>h2:hover .lk,.lk:focus{opacity:1}
.lk:hover{background:var(--brandbg);border-color:var(--line);color:var(--brand2)}
.lk.done{opacity:1;color:var(--ok);border-color:var(--line);background:var(--okbg)}

/* 上一篇 / 下一篇 */
.sec-nav{display:flex;gap:10px;margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line2)}
.sec-nav a,.sec-nav i{flex:1 1 0;min-width:0}
.sec-nav a{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  text-decoration:none;background:var(--paper)}
.sec-nav a:hover{border-color:var(--brand);background:var(--brandbg)}
.sec-nav a .d{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.sec-nav a .n{display:block;font-size:12.5px;color:var(--brand2);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-nav a.next{text-align:right}
/* 首尾节只有一边：保持半宽并贴到对应那一侧，和两边都在时的位置一致 */
.sec-nav a:only-child{flex:0 1 calc(50% - 5px)}
.sec-nav a.prev:only-child{margin-right:auto}
.sec-nav a.next:only-child{margin-left:auto}

/* FAQ 折叠 */
.faq{margin:10px 0}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--paper);margin:7px 0;overflow:hidden}
.faq details[open]{background:var(--paper);border-color:var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:10px 34px 10px 13px;position:relative;
  font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.6}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--brandbg)}
.faq summary:after{content:"+";position:absolute;right:13px;top:9px;color:var(--brand);
  font:400 15px/1.4 Consolas,monospace}
.faq details[open] summary:after{content:"–"}
.faq .a{padding:0 14px 11px;font-size:13px;color:var(--sub);line-height:1.85;border-top:1px dashed var(--line2);
  margin-top:0;padding-top:9px}

/* 速查页打印条 + 轻提示 */
.one-bar{margin:-2px 0 12px}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#39424e;color:#fff;
  font-size:12.5px;padding:8px 15px;border-radius:9px;box-shadow:0 6px 22px rgba(47,55,66,.25);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:70;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 右目录 */
.toc-title{font-size:10.5px;letter-spacing:.9px;color:var(--muted);font-weight:700;padding:0 8px 8px}
.toc a{display:block;padding:4px 8px 4px 12px;font-size:12px;color:var(--muted);
  border-left:2px solid transparent;line-height:1.5}
.toc a:hover{color:var(--ink);text-decoration:none}
.toc a.on{color:var(--brand2);border-left-color:var(--brand);font-weight:600}
.toc a.sub{padding-left:22px;font-size:11.5px}
/* 右栏只列当前这一节：节标题当第一项，顺手给个回顶入口 */
.toc a.sec-t{font-size:12.5px;font-weight:600;color:var(--sub);border-left-color:transparent}
.toc .toc-none{font-size:11.5px;color:var(--muted);padding:4px 12px}

.totop{position:fixed;right:24px;bottom:24px;width:40px;height:40px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--brand2);
  cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;z-index:40}
.totop.show{display:flex}
.foot{max-width:1360px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:11.5px;text-align:center}

@media(max-width:1180px){
  .layout{grid-template-columns:226px minmax(0,1fr)}
  .toc{display:none}
}
@media(max-width:820px){
  .hero-in{padding:16px 15px 12px;gap:12px}
  .hero-side{margin-left:0;width:100%;justify-content:flex-start}
  .layout,.foot{padding-left:15px;padding-right:15px}
  .layout{display:block;padding-top:16px}
  /* 目录改成抽屉：页头「目录」按钮唤出，从左侧滑入；不再用横向滚动 chips。
     .side 本身从 sticky 栏变成固定抽屉，默认移出视口，.open 时滑回。
     目录树沿用桌面基类（竖向分组），无需任何覆盖，搜索框也一并进抽屉。 */
  .toc-btn{display:inline-flex;align-items:center;gap:7px;margin:0 15px 4px;padding:8px 14px;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--brand2);
    font-size:13px;cursor:pointer}
  .toc-btn svg{flex:none}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:49;width:min(84vw,340px);max-height:none;
    overflow-y:auto;background:var(--bg);border-right:1px solid var(--line);padding:18px 16px 30px;
    box-shadow:12px 0 36px -18px rgba(10,18,30,.35);margin:0;
    transform:translateX(-104%);transition:transform .24s ease}
  .side.open{transform:translateX(0)}
  .hits .hit-t,.hits .hit-p{white-space:normal}
  .side-foot{display:block}
  .lead{padding:14px 16px}
  .sec{padding:16px 15px}
  .sec>h2{font-size:17px}
  /* 宽表格自身横向滚动，不撑破整页；窄屏首列取消 nowrap 让标签能折行 */
  .tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  .tbl td:first-child{white-space:normal;min-width:96px}
  .sec-nav{gap:8px}
  .sec-nav a,.sec-nav i{flex:1 1 0}
  .sec-nav a:only-child{flex:0 0 calc(50% - 4px)}
  .foot{padding-bottom:24px}
}
@media print{
  body[data-theme="dark"]{--bg:#faf8f5;--paper:#fff;--ink:#2f3742;--sub:#4a5a6e;--muted:#7d8794;--line:#e6e1d8;--line2:#f0ece4;--brand:#4a6fa5;--brand2:#3a5d8f;--brandbg:#eef3fa;--warnbg:#fbf5e9;--dangerbg:#fcf0ed;--okbg:#eef6f0;--onbrand:#fff;--herobg:#fff;--shadow:none}
  .hero,.side,.toc,.totop,#prog,.foot,.cp,.sec-nav,.lk,.one-bar,.toast,.crumb{display:none!important}
  body{background:#fff}
  .layout{display:block;padding:0;max-width:none}
  .sec{box-shadow:none;break-inside:avoid;border-color:#ddd}
  /* 「打印这一页」：只留速查节，其余整页隐藏 */
  body.print-one .sec:not(.sec-one),body.print-one .lead{display:none!important}
  body.print-one .layout{padding-top:0}
  .faq details{border-color:#ddd}
  .faq .a{display:block}
  a{color:inherit}
}
</style>
</head>
<body>
<div id="prog"></div>
<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <div class="logo">E</div>
      <div><h1 id="hero-t">EnvKit 使用文档</h1><p id="hero-p">从安装到排障，按节阅读 · 单文件、离线可用</p></div>
    </div>
    <div class="hero-side">
      <span class="ver" id="ver">v__APP_VERSION__</span>
      <button class="hbtn icon" id="theme" type="button" aria-label="切换暗色" title="切换暗色"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 1.9a6.3 6.3 0 0 0 7.7 7.7A6.6 6.6 0 1 1 6.4 1.9Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button class="hbtn" id="lang" type="button" title="Switch to English">EN</button>
      <a class="hbtn primary" id="cta" href="/">返回控制台</a>
    </div>
  </div>
  <button class="toc-btn" id="toc-btn" type="button" aria-controls="side" aria-expanded="false">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span id="toc-btn-t">目录</span>
  </button>
</header>

<div class="toc-mask" id="toc-mask" hidden></div>

<div class="layout">
  <aside class="side">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="搜索文档（按 / 聚焦）" />
      <kbd>/</kbd>
    </label>
    <div class="tree" id="tree"></div>
    <div class="hits" id="hits" hidden></div>
    <div class="side-foot">
      <a href="/#tour" id="replay">重新观看界面导览 →</a>
      <a href="https://github.com/hrui83771-gif" target="_blank" rel="noopener">项目主页 ↗</a>
      <span id="cnt"></span>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="lead"><b id="lead-t"></b><p id="lead-p"></p></div>

<script>
(function(){

  function v(x){ return x && typeof x === 'object' && !Array.isArray(x) ? (x[lang] || x.zh || '') : (x || ''); }

  var D = [
    {id:'runtime', group:z('开始使用','Get started'), title:z('EnvKit 是什么','What EnvKit is'), body:[
      P('表面上是单文件 Windows 程序：双击、浏览器打开本地控制台、四步完成环境。本质上是面向 Windows 环境的 Agent Runtime——模型负责决策，Runtime 负责边界，Verification 负责结论，三者分开。',
        'On the surface, a single-file Windows program: double-click, a local console opens, four steps to a ready environment. Underneath it is an Agent Runtime for Windows — the model decides, the Runtime enforces boundaries, Verification draws conclusions.'),
      H3('runtime-loop','四步循环','The four-step loop'),
      P('Observe → Reason → Act → Verify。第四步不是"模型想起来才做"的收尾，而是和前三步同等地位的一环：执行之后由验证器用端口、进程、HTTP、备份内容与链端共识去判断到底成没成。',
        'Observe → Reason → Act → Verify. The fourth step is not an afterthought the model may skip — it carries the same weight as the first three. After acting, verifiers use ports, processes, HTTP, backup contents and chain consensus to decide whether it actually worked.'),
      H3('runtime-rules','三条硬约束','Three hard constraints'),
      UL([
        z('推理灵活、执行受控：模型可自由决定调用顺序，但所有副作用都经过已注册的工具集，没有"执行任意命令"','Flexible reasoning, controlled execution: the model may reorder calls freely, but every side effect goes through a registered tool set; there is no arbitrary command execution'),
        z('权限由系统裁定：工具返回成功只代表命令发出去了，能不能说"已完成"由验证器的客观结论决定','The system decides permission: a tool returning success only means the command was sent; saying “done” is the verifier’s objective conclusion'),
        z('经验只影响决策：记忆改变"先查什么、要不要原样重试"，不改变任何操作的授权档位','Experience only affects decisions: memory changes what to check first and whether to retry as-is, never an operation’s permission tier')
      ]),
      NOTE('计划、动作、证据、复验结论、人工确认全部进轨迹与审计；跨会话仍能回答"上次那件事是怎么处理的"。',
           'Plans, actions, evidence, verification results and manual confirmations all go into traces and audit. Across sessions you can still answer how a past issue was handled.', 'ok')
    ]},
    {id:'verify', group:z('开始使用','Get started'), title:z('完成 ≠ 结论','Done ≠ verified'), body:[
      P('命令返回 0、进程派生成功、备份文件生成、端口有人监听、区块高度有变化——这些都是证据，不是结论。EnvKit 把"是否完成"的判定权从模型手里拿走。',
        'Exit code 0, a spawned process, a generated backup, a listening port or a changing block height are evidence, not conclusions. EnvKit takes the right to declare completion away from the model.'),
      H3('verify-evidence','证据对照表','Evidence vs. conclusion'),
      TABLE([z('证据','Evidence'),z('不足以说明','Does not prove'),z('因为','Because')],[
        [z('命令返回 0','Exit code 0'),z('服务可用','Service is usable'),z('可能端口没绑上、进程随后退出','Port may not be bound; process may exit afterwards')],
        [z('进程已派生','Process spawned'),z('服务健康','Service is healthy'),z('可能绑错端口、被别的进程占住','May bind the wrong port or be occupied')],
        [z('备份文件已生成','Backup file exists'),z('能还原','Restorable'),z('可能缺触发器、校验和对不上、导出被截断','May miss triggers, mismatch checksums or be truncated')],
        [z('区块高度静止','Static block height'),z('链卡死了','Chain is stuck'),z('PBFT 空块只共识不落盘，判活要看共识视图','PBFT empty blocks reach consensus without storage; check the consensus view')]

      H3('verify-mech','五个支撑机制','Five supporting mechanisms'),
      TABLE([z('层面','Layer'),z('解决什么','What it solves')],[

        [z('Policy 四档权限','Policy tiers'),z('"什么算危险"散落多处，换个入口就能绕过','“What is dangerous” was scattered; another entry point bypassed it')],

    {id:'quick', group:z('开始使用','Get started'), title:z('接入项目，再走四步','Set up, then four steps'), body:[

      H3('quick-flow','第一次使用怎么走','First-time flow'),

        z('接入项目：选前端 / 后端目录，EnvKit 自动识别项目类型、启动方式、端口和数据库配置。检查是只读的，不会启动服务。',
          'Set up the project: choose the front/back-end folders and EnvKit works out the project type, start command, ports and database settings. The check is read-only and starts nothing.'),
        z('环境安装：检测 Go / Node.js / MySQL，Java 后端还会检查 JDK 和 Maven。下载走国内镜像，校验 SHA256，失败会自动换源。',

        z('链端校验：填 SSH 与链目录，检查节点端口、进程与共识视图。',

        z('程序启动：先后端再前端；日志按来源分栏。EnvKit 正常从桌面启动时，退出会带走子进程；从 IDE / 终端启动时可能带不走，见「停止到底停没停」。',
          'Start: backend first, then frontend. Logs are split by source. When EnvKit runs normally from the desktop, exiting reaps its children; when launched from an IDE or terminal it may not — see “Did stop really stop?”.')

      H3('quick-console','控制台与后台','Console and background'),
      NOTE('控制台默认 http://127.0.0.1:18765/ ，端口冲突时自动顺延。那个黑色命令行窗口就是服务本体：关掉它网页就打不开。要从托盘菜单选「隐藏窗口到托盘」，不是结束进程。新版本已把控制台换成纸白底的浅色主题。',
           'The console defaults to http://127.0.0.1:18765/ and shifts ports on conflict. The console window IS the service: closing it kills the page. Use the tray menu to hide it, not to end the process. New builds use a light paper-coloured theme.'),
      P('第一次接入的细节见下一节「项目接入向导」；快捷键、地址栏深链见「快捷键与深链」。',
        'For first-time setup details see “Project setup wizard”; for shortcuts and URL deep links see “Shortcuts & deep links”.')
    ]},

    {id:'project', group:z('开始使用','Get started'), title:z('项目接入向导','Project setup wizard'), body:[
      P('向导只做三件事：选目录、只读检查、保存配置。它不会启动服务、不会安装依赖、不会结束进程。你要做的只是告诉它前后端在哪里。',
        'The wizard does three things: choose folders, run a read-only check, save the result. It does not start services, install dependencies or end processes. You only tell it where the front and back ends are.'),
      H3('project-open','什么时候出现','When it appears'),
      UL([
        z('第一次打开，且前后端目录都为空：首屏引导结束后自动弹出。','First launch with both folders empty: it opens after the welcome tour.'),

        z('点「稍后再说」：这次先跳过，之后不会再反复弹；需要时从顶栏进入。','“Later” skips it for now and stops repeated pop-ups; reopen it from the top bar when ready.'),

        z('开始检查：进度条会显示正在看哪一项，检查很快完成时画面会放慢，方便看清步骤。',

        z('端口后面的来源和百分比表示“有多确定”，不是硬性结论；没识别到端口也不影响保存，启动时会继续探测。','The source and percentage after a port show how confident the guess is, not a final answer. No port hint does not block saving; start-up will keep probing.'),
        z('黄色「留意」不是失败：例如没找到 package.json、数据库密码没解析、工具没装。能保存，但启动前最好先处理。','A yellow warning is not a failure: for example no package.json, no database password or a missing tool. You can still save, but fix it before starting if possible.'),
        z('如果目录选错了，返回第一步改；不需要关闭整个向导。','If a folder is wrong, go back to step one; no need to close the whole wizard.')

      H3('project-db','数据库：先测试，再建库，再导入','Database: test, create, import'),

          'Select a database candidate and press “Test connection”. Seeing the MySQL version and whether the database exists means the account and network are fine.'),
        z('库不存在时，可以勾选「保存后建库」，EnvKit 会创建空库。','If the database is missing, tick “Create after saving” and EnvKit creates an empty database.'),
        z('需要初始化表结构时，再勾选「建库后导入 SQL」。SQL 文件从项目目录里查找，默认优先 schema.sql。',
          'To create tables too, tick “Import SQL after creating”. SQL files are found inside the project, with schema.sql preferred.'),
        z('导入成功后会记住这个 SQL 文件，下次在程序配置里还能看到。','After a successful import, the SQL file is remembered and shown later in Configuration.')
      ]),
      NOTE('导入 SQL 会直接执行，不会自动备份。已有数据的库上导入，可能重复建表或覆盖数据；只选你确认过的初始化脚本。同一个文件重复执行时会有历史提示，但仍会继续。',
           'Importing SQL runs it directly and does not create a backup. On a database that already has data it may duplicate tables or overwrite data; only use an init script you trust. Running the same file again shows a history warning but still proceeds.', 'danger'),

        z('密码只在本机加密保存，不出现在检查结果里，也不会写进日志。','Passwords are encrypted on this machine only; they never appear in check results or logs.'),

           'Editing web/index.html directly is overwritten on the next build; web_build.py --check only verifies consistency, it does not re-embed.', 'warn'),
      H3('install-cap','环境安装','Environment setup'),
      P('检测会同时读版本号与安装位置，不只看命令能不能跑。前端需要 Node.js，Go 后端需要 Go，Java 后端还需要符合 pom.xml 要求的 JDK 和 Maven；向导会一并检查。安装走国内镜像，下载后校验 SHA256，失败自动换源重试。',
        'Detection reads both version and install path, not just whether a command runs. Front ends need Node.js, Go backends need Go, and Java backends also need a JDK matching pom.xml plus Maven; the wizard checks all of them. Installs use domestic mirrors, verify SHA256, and retry from another source on failure.'),
      TABLE([z('能力','Capability'),z('说明','Detail')],[
        [z('演练安装','Dry run'),z('先列出会下载什么、装到哪里，再决定是否真装','See what would be downloaded and installed before committing')],
        [z('SHA256 校验','SHA256 check'),z('下载完比对摘要，不对就换源重试','Compare hashes after download; retry from another source on mismatch')],
        [z('版本管理','Version manager'),z('组件版本集中管理，可单独升级，不必重装整套','Central version list; upgrade a single component without reinstalling everything')],
        [z('镜像配置','Mirrors'),z('GOPROXY 与 npm registry 自动指向可达的国内源','GOPROXY and npm registry point at reachable domestic mirrors')]
      ]),
      NOTE('注册或启动 MySQL 服务需要管理员权限：右键 EnvKit.exe「以管理员身份运行」只在这一步需要，其余功能照常用。',
           'Registering or starting the MySQL service needs administrator rights: run EnvKit.exe as administrator only for that step; everything else works normally.', 'warn')
    ]},
    {id:'upgrade', group:z('安装与构建','Install & build'), title:z('升级、回滚与卸载','Upgrade, rollback & uninstall'), body:[
      P('EnvKit 是单文件程序，没有安装器：所谓升级就是把新 exe 覆盖旧的。麻烦不在覆盖本身，而在"哪个副本在运行、配置会不会被冲掉、想退回上一版怎么办"这三件事。',
        'EnvKit is a single-file program with no installer: upgrading simply overwrites the old exe with a new one. The trouble is not the copy itself, but three questions — which copy is running, whether config survives, and how to go back.'),
      H3('upgrade-overwrite','覆盖升级','In-place upgrade'),
      STEPS([
        z('先退出正在运行的实例：托盘图标右键退出，或关闭所有 EnvKit 窗口。exe 被占用时复制会失败，这是升级没生效的头号原因。',
          'Quit the running instance first: right-click the tray icon to exit, or close all EnvKit windows. A locked exe makes the copy fail — the number one cause of an upgrade that “did not take”.'),
        z('从 Releases 下载新压缩包，解压后运行 安装.bat：它把新 exe 复制到 %LOCALAPPDATA%\\EnvKit 并更新桌面快捷方式。',
          'Download the new archive from Releases, unpack and run 安装.bat: it copies the new exe into %LOCALAPPDATA%\\EnvKit and refreshes the desktop shortcut.'),
        z('确认打开的是新版本：页头版本号应变化；若还是旧的，多半是快捷方式指向了另一份副本，见下条。',
          'Confirm you are on the new build: the header version should change. If it does not, the shortcut probably points at another copy — see below.'),
        z('配置不用重新填：config.json 在 exe 同目录，安装脚本只覆盖 exe 和使用说明，不会碰它。',
          'No need to re-enter settings: config.json sits next to the exe, and the install script only overwrites the exe and readme — it leaves config alone.')
      ]),
      NOTE('从源码自己编译时顺序是 web_build.py → go build，且 go build 前要先退出运行中的实例；只跑其中一步会让人以为"改了没生效"。见「从源码构建」。',
           'When building from source, run web_build.py then go build, and quit the running instance before go build. Doing only one step looks like “nothing changed”. See Build from source.', 'warn'),
      H3('upgrade-shortcut','快捷方式指向旧副本','Shortcut points at an old copy'),
      TABLE([z('现象','Symptom'),z('原因','Cause'),z('处理','Fix')],[
        [z('升级后版本号没变','Version unchanged after upgrade'),z('快捷方式指向 %LOCALAPPDATA%\\EnvKit 的旧 exe','Shortcut points at the old exe in %LOCALAPPDATA%\\EnvKit'),z('重跑 安装.bat，或直接打开仓库根的 EnvKit.exe','Rerun 安装.bat, or open the repo-root EnvKit.exe directly')],
        [z('两份 exe 版本不一致','Two exes with different versions'),z('仓库根一份、%LOCALAPPDATA%\\EnvKit 一份，各自更新','One at repo root, one in %LOCALAPPDATA%\\EnvKit, updated separately'),z('认准常用那份；两份都在时以快捷方式 TargetPath 为准','Stick to one; when both exist, trust the shortcut’s TargetPath')]
      ]),
      H3('upgrade-rollback','回滚到上一版','Roll back'),
      P('程序本身没有回滚功能，但单文件让回滚很简单：升级前把当前 exe 另存一份（如 EnvKit-v3.7.2.exe），要退回时用它覆盖回去即可。config.json 建议一并备份——如果新版改了配置结构，回滚后旧 exe 未必能读懂新配置。',
        'There is no built-in rollback, but a single file makes it easy: before upgrading, save a copy of the current exe (e.g. EnvKit-v3.7.2.exe), then overwrite with it to roll back. Back up config.json too — if a new version changed its schema, the old exe may not read the newer config.'),
      CODE(':: back up the current exe before upgrading\n:: (replace v3.7.2 with your actual version)\ncopy /Y EnvKit.exe EnvKit-v3.7.2.exe\n:: to roll back, overwrite with the backup\ncopy /Y EnvKit-v3.7.2.exe EnvKit.exe',
           'bat'),
      NOTE('上面代码块里的文件名只是占位示例，按你当前的实际版本改名；配置备份用「程序配置」页的导出功能，导出的文件可脱敏。',
           'The filename in the sample is a placeholder — rename it to your actual version. Back up config via the export action on the Configuration page; the export can be redacted.', 'warn'),
      H3('upgrade-uninstall','彻底卸载','Full uninstall'),
      P('发布包里带一个 卸载.bat：它结束 EnvKit 进程，删除 %LOCALAPPDATA%\\EnvKit 里的 exe、使用说明和 config.json，并移除桌面快捷方式。想保留配置就先把 config.json 复制出去再运行。',
        'The release archive ships a 卸载.bat: it stops EnvKit, deletes the exe, readme and config.json in %LOCALAPPDATA%\\EnvKit, and removes the desktop shortcut. Copy config.json out first if you want to keep it.'),
      NOTE('卸载脚本不会自动删除以下内容，需要按需手动清理：C:\\EnvKit\\tools 组件目录、已注册的 MySQL 服务与数据库数据、PATH 里的环境变量、项目里的 backups 备份目录，以及 exe 同目录的 envkit-*.log 日志。它也不会写注册表的卸载项，所以"添加/删除程序"里看不到 EnvKit 是正常的。',
           'The uninstall script does not remove these — clean them up manually as needed: the C:\\EnvKit\\tools component directory, the registered MySQL service and its data, PATH entries, the backups directory in your project, and the envkit-*.log files next to the exe. It also writes no registry uninstall entry, so EnvKit not appearing in “Add / Remove Programs” is expected.', 'warn'),
      XLINK([['install','安装与构建','Install & build'],['start','程序启动与日志','Start and logs'],['config','程序配置','Configuration'],['troubleshoot','排障索引','Troubleshooting']])
    ]},

    {id:'config', group:z('日常操作','Daily operations'), title:z('程序配置','Configuration'), body:[
      P('config.json 放在 exe 同目录，覆盖内置默认值；config.dist.json 是干净模板。项目接入向导保存的结果也会写到这里。数据库连接检测、建库建表、一键备份 / 还原（失败自动重试）、前端 npm install / 后端 go mod tidy、配置导入导出（可脱敏分享）、环境诊断报告都在这一页。',
        'config.json lives next to the exe and overrides built-in defaults; config.dist.json is a clean template. Results saved by the project setup wizard also land here. Database checks, schema creation, backup / restore with retries, npm install / go mod tidy, redacted config export / import and diagnostic reports all live here.'),
      H3('config-keys','config.json 关键字段','Key config fields'),
      TABLE([z('字段','Field'),z('默认 / 示例','Default / example'),z('用途','Purpose')],[
        [z('dev.server_port','dev.server_port'),z('18765','18765'),z('控制台端口，冲突时向后扫描到 18815','Console port; shifts up to 18815 on conflict')],
        [z('goproxy','goproxy'),z('goproxy.cn,goproxy.io,direct','goproxy.cn,goproxy.io,direct'),z('Go 组件下载源，逗号分隔按顺序回退','Go component sources, comma-separated fallback order')],
        [z('npm_registry','npm_registry'),z('mirrors.cloud.tencent.com/npm/','mirrors.cloud.tencent.com/npm/'),z('npm 依赖下载源','npm dependency source')],
        [z('mysql.port / service_name','mysql.port / service_name'),z('3306 / MySQL80','3306 / MySQL80'),z('MySQL 绿色版端口与服务名','Port and service name of portable MySQL')],
        [z('projects.frontend_dir / backend_dir','projects.frontend_dir / backend_dir'),z('留空 → 首次打开会被向导接走','empty → first launch goes to the wizard'),z('前端、后端的项目根目录，不是某个源文件','Project roots for the front and back ends, not a source file')],
        [z('projects.web_script','projects.web_script'),z('留空 → 自动推断','empty → auto-detect'),z('想固定前端启动脚本时才填；脚本不存在会自动换回可用项','Fill this only to pin a front-end script; a missing script falls back automatically')],
        [z('projects.scan_ports','projects.scan_ports'),z('诊断用的端口清单','diagnostic port list'),z('只帮你观察端口，不用来判断“前端端口冲突”','Used only to observe ports, not to decide a front-end conflict')],
        [z('projects.db_name / sql_file / backup_dir','projects.db_name / sql_file / backup_dir'),z('库名 / 初始化 SQL / backups','database name / init SQL / backups'),z('向导建库或导入 SQL 后会写入 sql_file','The wizard writes sql_file after creating a database or importing SQL')],
        [z('chain.ssh_*','chain.ssh_*'),z('留空 → 在界面填','empty → fill in UI'),z('SSH 主机 / 端口 / 用户 / 密码或私钥 / 主机指纹','SSH host / port / user / password or key / host fingerprint')],
        [z('chain.chain_guard_secs','chain.chain_guard_secs'),z('60（最小 30）','60 (min 30)'),z('后台守护检测间隔（秒）','Background guard interval in seconds')],
        [z('chain.chain_autorecover / guard / notify','chain.chain_autorecover / guard / notify'),z('false','false'),z('一键自动恢复 / 周期守护 / 桌面通知，按需打开','One-click recovery / periodic guard / desktop notification, off until enabled')],
        [z('ai.enabled','ai.enabled'),z('false','false'),z('AI 助手总开关；密钥经 DPAPI 加密存本机','AI master switch; key stored locally with DPAPI')],
        [z('update.interval_hours','update.interval_hours'),z('72','72'),z('检查 GitHub Releases 的间隔（小时）','Hours between GitHub Releases checks')],
        [z('notify.muted / pet.weather_enabled','notify.muted / pet.weather_enabled'),z('false','false'),z('全局静音 / 天气查询，默认都关，按需开','Global mute / weather, both off by default')]
      ]),
      H3('config-apply','怎么改才生效','How changes take effect'),
      STEPS([
        z('改设置页里的开关与阈值：保存后即时生效，写回 config.json 并自动留上一版备份。',
          'Change switches and thresholds in Settings: they take effect immediately, are written back to config.json and a previous-version backup is kept.'),
        z('改端口、目录这类连接参数：先在「程序配置」改数据库连接并测试，再改项目目录，最后重启前后端让进程读到新值。',
          'For ports and paths: change and test the database connection in Configuration, then project paths, then restart front and back end so processes pick up the new values.'),
        z('直接编辑 config.json：改完要重启 EnvKit；导出配置默认脱敏，分享前确认没带上密钥。',
          'Editing config.json directly requires an EnvKit restart. Exported configs are redacted by default — check no key slipped in before sharing.')
      ]),
      H3('config-files','本机文件','Files on this machine'),
      CODE(z('config.json                 当前配置\nconfig.dist.json           干净模板\naudit-YYYYMMDD.jsonl       操作审计（保留 30 天）\nenvkit-YYYYMMDD.log        运行日志（按日轮转）\nmissions.json / playbooks.json / memories.json   行动 / 预案 / 记忆',
             'config.json                 active config\nconfig.dist.json           clean template\naudit-YYYYMMDD.jsonl       operation audit (kept 30 days)\nenvkit-YYYYMMDD.log        daily rotating log\nmissions.json / playbooks.json / memories.json   actions / playbooks / memory'),''),
      NOTE('API Key 与数据库密码经 Windows DPAPI 加密，只在本机可解密。导出的配置默认脱敏，分享前再确认一次没有带上密钥。',
           'API keys and database passwords are encrypted with Windows DPAPI and decrypt only on this machine. Exported configs are redacted by default — check again before sharing.', 'danger'),
      XLINK([['project','项目接入向导','Project setup wizard'],['start','程序启动与日志','Start and logs'],['troubleshoot','排障索引','Troubleshooting']])
    ]},

    {id:'chain', group:z('日常操作','Daily operations'), title:z('链端校验','Chain checks'), body:[
      P('支持 FISCO-BCOS v2 / WeBASE-Front 连通检测、SSH 密码或私钥登录、页面内嵌终端与远程目录浏览；节点异常可一键检测或交给后台守护自动恢复，并触发 Windows 通知。',
        'Supports FISCO-BCOS v2 / WeBASE-Front connectivity, SSH password or key login, an embedded terminal and remote directory browsing. Recovery can be manual or handled by the background guard with Windows notifications.'),
      H3('chain-fields','要填哪些字段','Fields to fill'),
      TABLE([z('位置','Where'),z('字段 / 示例','Field / example'),z('说明','Detail')],[
        [z('程序配置 → 链端配置','Configuration → Chain'),z('主机 192.0.2.10 · 端口 22 · 用户 root','Host 192.0.2.10 · port 22 · user root'),z('先填这个并点「测试 SSH 连接」，绿了再往下','Fill this and test SSH first; continue only when it passes')],
        [z('链端配置','Chain config'),z('密码留空则用私钥','Leave password empty to use a private key'),z('私钥填本机路径；首次连接按 TOFU 记主机指纹','Key is a local path; first connect records the host fingerprint (TOFU)')],
        [z('链端配置 → 链','Chain config → chain'),z('链主机留空 = 同 SSH 主机；端口 20200','Chain host empty = same as SSH host; port 20200'),z('链主机与 SSH 不同机时才填','Only fill when the chain host differs from SSH')],
        [z('链端配置 → 链','Chain config → chain'),z('链端目录 /opt/fisco/nodes/127.0.0.1','Chain dir /opt/fisco/nodes/127.0.0.1'),z('点「选择」用远程目录浏览挑，别手输错路径','Use the remote picker instead of typing a path by hand')],
        [z('链端配置 → 链','Chain config → chain'),z('启动脚本 bash start_all.sh','Start script bash start_all.sh'),z('宕机自愈时 EnvKit 用它在远端拉起节点','Used by self-healing to restart the node remotely')],
        [z('链端配置 → WeBASE','Chain config → WeBASE'),z('W 目录 /opt/webase/webase-front · 脚本 bash start.sh · 端口 5002 · 群组 1','W dir /opt/webase/webase-front · script bash start.sh · port 5002 · group 1'),z('只在用 WeBASE-Front 时填','Only needed when using WeBASE-Front')]
      ]),
      H3('chain-flow','一次完整检测','One full check'),
      STEPS([
        z('填 SSH 主机 / 端口 / 用户与凭据，点「测试 SSH 连接」；状态变绿再继续。',
          'Fill SSH host / port / user and credentials, then test the connection; continue once it turns green.'),
        z('填链端口与目录，用「选择」远程挑目录；需要 WeBASE 再填 W 目录与端口。',
          'Fill the chain port and directory, use the picker to choose the remote directory; fill WeBASE fields only if used.'),
        z('点「检测」看四项：节点端口、进程、共识视图推进、WeBASE 地址；成功信号是「检测通过」，不是命令返回 0。',
          'Press Check and inspect four things: node port, process, consensus view progression and WeBASE URL. Success means the check passed, not exit code 0.'),
        z('要拉起服务用「启动」菜单分别启动节点与 WeBASE；需要命令行时用「终端」或远程执行命令。',
          'Use the Start menu to bring up the node and WeBASE separately; use Terminal or remote exec for commands.'),
        z('挂机无人值守再打开「后台守护」，间隔默认 60 秒、最小 30；需要弹通知加开 chain_notify。',
          'For unattended runs enable the background guard (default 60 s, minimum 30) and chain_notify for desktop alerts.')
      ]),
      H3('chain-live','三种容易误判的情况','Three easy misreads'),
      NOTE('判活看的是共识视图是否推进，不是区块高度。PBFT 空块只共识不落盘，块高静止是正常态；拿块高判活会把健康链永远判成未恢复。',
           'Liveness is judged by consensus view progression, NOT block height. PBFT empty blocks reach consensus without being stored, so a static height is normal; judging by height marks healthy chains as unrecovered.', 'danger'),
      UL([
        z('SSH 指纹变了连接被拒——那是保护不是故障：先核对新指纹再决定是否更新，别直接关校验。','A rejected SSH connection after a fingerprint change is protection, not breakage: verify the new fingerprint before trusting it, never simply disable the check.'),
        z('自愈态势页空列表表示尚无守护 / 影子记录，不代表守护没配置；看配置页的守护开关。','An empty self-healing list means no guard or shadow records yet, not that guarding is off; check the switch on the config page.'),
        z('「已执行」只说明命令跑了：端口、进程、共识视图、WeBASE 地址四项都拿到证据才算完成。','“Executed” only means the command ran: completion needs evidence from all four — port, process, consensus view and WeBASE URL.')
      ]),
      XLINK([['selfheal','故障自愈轨迹','Self-healing traces'],['troubleshoot','排障索引','Troubleshooting']])
    ]},

    {id:'start', group:z('日常操作','Daily operations'), title:z('程序启动与日志','Start and logs'), body:[
      P('前后端一键启动（先后端、再前端），访问地址自动解析；日志按来源分栏并清理 ANSI 转义码，支持复制、下载和自动滚动。日志会写到 exe 同目录的 envkit-<日期>.log、envkit-<日期>-web.log 和 envkit-<日期>-backend.log。',
        'Start backend then frontend with one click; access URLs are resolved automatically. Logs are split by source, stripped of ANSI codes, and support copy, download and auto-scroll. Log files land next to the exe as envkit-<date>.log, envkit-<date>-web.log and envkit-<date>-backend.log.'),
      H3('start-flow','启动顺序','Start order'),
      STEPS([
        z('先在「程序配置」填好前后端目录与数据库连接并测试；目录填的是项目根，不是某个源文件。',
          'In Configuration, set and test the front/back-end paths and DB connection first; paths point at project roots, not source files.'),
        z('到「程序启动」点启动：先后端、再前端，访问地址由端口与入口文件自动解析。',
          'On the Start page press start: backend first, then frontend; the access URL is resolved from ports and entry files.'),
        z('看日志页：按 install / config / start / chain / sys 分栏，已清理 ANSI 转义码，可复制、下载、自动滚动。',
          'Read the Logs page: split into install / config / start / chain / sys, ANSI codes stripped, with copy, download and auto-scroll.'),
        z('验证要用「检测」或 AI 的 verify_environment：看端口、HTTP 握手、进程数，不看启动按钮的反应。',
          'Verify with Check or the AI verify_environment tool: ports, HTTP handshake and process count — not the start button reaction.'),
        z('停止后看端口是否真的释放：显示“未完全停止”时先处理残留进程，再重新启动。','After stopping, check that the port is actually free; if “partly stopped” appears, clear the leftover process before restarting.')
      ]),
      H3('start-script','前端启动脚本怎么选','How the front-end script is chosen'),
      P('启动页的脚本框留空时，EnvKit 会读 package.json，按 dev → serve → start → watch 的顺序挑一个能用的。你也可以在「程序配置」的 web_script 里固定一个。',
        'Leave the script box empty and EnvKit reads package.json, preferring dev → serve → start → watch. You can also pin one with web_script in Configuration.'),
      UL([
        z('配置了脚本名，但 package.json 里没有：EnvKit 会自动换回能用的脚本，不会硬跑一条 Missing script。','If the configured script is missing from package.json, EnvKit falls back to a usable one instead of running a doomed “Missing script”.'),
        z('程序启动页和 AI 启动用的是同一套判断，不会出现页面跑 serve、AI 跑 dev 的分叉。','The Start page and AI start use the same rule, so one cannot run serve while the other runs dev.'),
        z('启动日志会写出实际用的脚本和来源，先看这一行再排查其它问题。','The log shows the script actually used and where it came from; read that line before debugging anything else.')
      ]),
      H3('start-port','端口怎么判断','How ports are decided'),
      P('前后端端口来自项目配置和启动文件，不是写死的。识别不到时先启动，启动后再继续探测。',
        'Front and back-end ports come from project config and start files, not hard-coded values. If none is found, start the service and keep probing.'),
      UL([
        z('前端卡片应该显示前端自己的端口，例如 Vite 的 5173；后端卡片显示 8080、8888 这类后端端口。','The front-end card should show its own port, for example Vite on 5173; the back-end card shows ports such as 8080 or 8888.'),
        z('projects.scan_ports 只是“端口线索”，帮你观察，不用来判断前端端口冲突。','projects.scan_ports is only a port hint list for observation; it is not used to decide a front-end port conflict.'),
        z('看到“8080 被 java.exe 占用”时先确认它是不是后端；不要因此把前端拦下。','If 8080 is held by java.exe, check whether that is the backend first; do not block the front end because of it.'),
        z('真正要关注的是前端自己的端口有没有被别的进程占住，以及占用者是不是它应该用的进程。','What matters is whether the front-end port itself is taken, and whether the owner is the expected process.')
      ]),
      H3('start-stop','停止到底停没停','Did stop really stop?'),
      UL([
        z('停止会等端口真正释放再给结论；如果 npm 的 Vite 子进程还占着 5173，会显示“未完全停止”，不会假装成功。','Stop waits for the port to free before reporting; if npm’s Vite child still holds 5173, it says “partly stopped” instead of pretending success.'),
        z('EnvKit 只停自己启动的进程。外部启动的 Vite、后端或数据库，只报告 PID 和端口，不会替你结束。','EnvKit stops only processes it started. Externally started Vite, backends or databases are reported with PID and port, never killed for you.'),
        z('确实要结束时，到「端口诊断」核对命令行和路径，再点「结束进程」，会再确认一次。','To end one, check its command line and path in Port Diagnostics, then press “Kill process”; it asks once more.'),
        z('EnvKit 从 IDE 或终端里启动时，可能已经在别的 Job 里，子进程就无法再绑定自动回收；退出 EnvKit 后如果端口还在，按上一条手工处理。','When EnvKit itself runs from an IDE or terminal, it may already be inside another Job, so children cannot be bound for automatic reaping; if a port remains after exit, use the step above.'),
        z('操作审计只追加、按天分文件保留 30 天；密码与 API Key 入库前已脱敏。','Operation audit is append-only, kept in daily files for 30 days; passwords and API keys are redacted before writing.')
      ]),
      H3('start-jdk','Java 后端和 JDK','Java backends and JDK'),
      P('Java 后端会先看 pom.xml 要求的 Java 版本。当前 JDK 太旧时，EnvKit 只在这次启动里换一个兼容的 JDK，不会改你的 JAVA_HOME 或系统环境变量。',
        'For Java backends EnvKit reads the Java version required by pom.xml. If the current JDK is too old, it uses a compatible JDK for this launch only; it does not change JAVA_HOME or system environment variables.'),
      NOTE('一个 JDK 都找不到时才会报错。看到 UnsupportedClassVersionError，先把 JDK 版本对齐项目要求，不要先去改代码。',
           'It only errors when no JDK can be found at all. If you see UnsupportedClassVersionError, align the JDK version with the project first; do not start by changing code.', 'warn'),
      H3('start-logfiles','日志文件在哪','Log files on disk'),
      P('除了界面里的日志页，每一天的内容也会落盘成文件，放在 exe 同目录：EnvKit 自身是 envkit-<日期>.log（单文件上限 5 MB，保留 10 份归档）；业务前后端是 envkit-<日期>-web.log 和 envkit-<日期>-backend.log（单文件上限 8 MB，保留 5 份归档）。文件名里的日期形如 20261118，旧文件按顺序编号 .1、.2 轮转。',
        'Besides the in-app Logs page, each day’s output is also written to disk next to the exe: EnvKit itself uses envkit-<date>.log (5 MB per file, 10 archives kept); the business frontend and backend use envkit-<date>-web.log and envkit-<date>-backend.log (8 MB per file, 5 archives kept). The date looks like 20261118; older files rotate as .1, .2 and so on.'),
      H3('start-export','导出与脱敏','Export and redaction'),
      TABLE([z('方式','Way'),z('导出内容','What it exports'),z('是否脱敏','Redacted?')],[
        [z('日志页「下载」','Logs page “Download”'),z('当前查看的那一栏原始文本（已清 ANSI 转义码），存成 envkit-<栏名>.log','Raw text of the single tab you are viewing (ANSI codes stripped), saved as envkit-<tab>.log'),z('否。原样导出，发给别人前请自行检查口令 / API Key','No. Exported verbatim — check for passwords / API keys before sharing')],
        [z('诊断报告','Diagnostic report'),z('get_diag_report 生成的 Markdown 报告','The Markdown report from get_diag_report'),z('是，内部已脱敏凭据','Yes, credentials are redacted internally')],
        [z('操作审计','Operation audit'),z('按天分文件的 audit-*.jsonl，保留 30 天','Daily audit-*.jsonl files, kept 30 days'),z('是，参数与详情统一脱敏','Yes, params and details are redacted')]
      ]),
      NOTE('日志页「下载」只导当前那一栏，不是全部日志；要交给他人的排障材料，优先用脱敏的诊断报告。',
           '“Download” on the Logs page exports only the current tab, not everything. For material you hand to someone else, prefer the redacted diagnostic report.', 'warn'),
      NOTE('日志停在某一步且没有任何异常，先确认进程是否还在、退出码是什么——历史上 Windows 句柄重复关闭会让进程无声消失。',
           'If a log stops mid-step with no error, check whether the process is still alive and what its exit code was — a double-closed Windows handle has caused silent exits before.', 'warn'),
      XLINK([['project','项目接入向导','Project setup wizard'],['config','程序配置','Configuration'],['upgrade','升级、回滚与卸载','Upgrade, rollback & uninstall'],['troubleshoot','排障索引','Troubleshooting']])
    ]},

    {id:'selfheal', group:z('日常操作','Daily operations'), title:z('故障自愈轨迹','Self-healing traces'), body:[
      P('链端守护在后台按周期检查节点，异常时按预案处置；每一次动作都留轨迹，在自愈态势页能看到谁、在什么时候、做了什么、结果如何。断流或重启后点「继续」，从最后完成的步骤接着跑。',
        'The chain guard checks nodes periodically in the background and handles anomalies through playbooks. Every action leaves a trace, so the self-healing dashboard shows who did what, when and with what result. After a drop or restart, press Continue to resume from the last completed step.'),
      H3('selfheal-view','自愈态势页','Self-healing dashboard'),
      UL([
        z('守护轨迹逐条记录触发、动作与复验结论；空列表表示尚无记录，不代表守护没配置','Guard traces record each trigger, action and verification result; an empty list means no records yet, not that guarding is disabled'),
        z('影子晋升看板展示策略从影子流到正式晋升的证据；未注册策略标为「待定」','The shadow promotion board shows evidence of a strategy moving from shadow flow to production; unregistered strategies are marked pending'),
        z('策略集合取「已配置 ∪ 影子流跑过」，没登记但跑过的也会列出来','The strategy set is “configured ∪ seen in shadow flow”, so unregistered but executed strategies are listed too')
      ]),
      H3('selfheal-guard','守护开关','Guard switches'),
      P('config.json 里 chain_autorecover 控制一键检测后的自动恢复，chain_guard 打开周期守护（chain_guard_secs 秒），chain_notify 触发 Windows 通知。主机联系不上时只记录、不误报。',
        'In config.json, chain_autorecover enables automatic recovery after a manual check, chain_guard turns on periodic guarding (chain_guard_secs seconds), and chain_notify triggers Windows notifications. When the host is unreachable it records the fact without a false alarm.'),
      NOTE('复验通过才算完成；命令返回 0 只说明命令跑了。判活看共识视图推进，不看块高。',
           'Only a passed verification counts as done; exit code 0 only means the command ran. Liveness is judged by consensus view progression, not block height.', 'danger')
    ]},
    {id:'ai', group:z('AI 与自动化','AI & automation'), title:z('AI 助手','AI assistant'), body:[
      P('右下角桌宠是状态出口，点它打开 AI 抽屉。一组受控工具覆盖状态、日志、审计、诊断、数据库、检测、启停、白名单与清理；对话支持 Markdown、表格与代码高亮。兼容任意 OpenAI 协议模型，Key 经 DPAPI 加密。',
        'The desktop pet is a status outlet; click it to open the AI drawer. controlled tools cover status, logs, audit, diagnostics, database, checks, start/stop, allowlist and cleanup. Chat supports Markdown, tables and code highlighting, with any OpenAI-compatible model and a DPAPI-encrypted key.'),
      H3('ai-tools','工具按类看','Tools by category'),
      TABLE([z('类别','Category'),z('真实工具名','Actual tool names'),z('能做什么','What they do')],[
        [z('状态与诊断','State & diagnosis'),z('get_system_state · get_env_snapshot · get_project_brief · get_diag_report','get_system_state · get_env_snapshot · get_project_brief · get_diag_report'),z('环境状态、本回合注入的快照、项目画像（语言/脚本/入口）、脱敏诊断报告','Environment state, this turn’s snapshot, project brief and a redacted diagnostic report')],
        [z('日志与审计','Logs & audit'),z('get_logs · get_audit_log','get_logs · get_audit_log'),z('按 install/config/start/chain/sys 读日志；查「谁、何时、做了什么、结论」','Read logs by scope; query who did what and with what result')],
        [z('数据库','Database'),z('db_check · db_list · db_query · db_backup · list_backups','db_check · db_list · db_query · db_backup · list_backups'),z('连接检测、列库表行数、只读查询（SELECT/SHOW/DESCRIBE/EXPLAIN/WITH）、备份与只读列备份','Connection check, list DBs, read-only queries, backup and read-only backup listing')],
        [z('文件与附件','Files & attachments'),z('list_project · search_files · read_file · read_doc','list_project · search_files · read_file · read_doc'),z('列目录、按名/内容搜文件、分页精读项目文件、分页读拖入的 PDF/Office 附件','List, search, page through project files and read dragged-in PDF/Office attachments')],
        [z('环境与复验','Env & verification'),z('check_env_req · run_detection · verify_environment','check_env_req · run_detection · verify_environment'),z('比对 go.mod/package.json 的版本要求、重新检测组件、按端口/进程/HTTP/备份/共识复验','Check version requirements, re-detect components and verify by port/process/HTTP/backup/consensus')],
        [z('服务与进程','Services & processes'),z('start_service · stop_service · restart_service · cleanup_processes','start_service · stop_service · restart_service · cleanup_processes'),z('前后端启停重启；清理只停 EnvKit 管的服务并报告端口占用，第三方进程只报告','Start/stop/restart services; cleanup stops only EnvKit’s services and reports port owners')],
        [z('链端与守护','Chain & guard'),z('get_chain_guard · sync_chain_ip','get_chain_guard · sync_chain_ip'),z('查守护状态与最近结果；把后端链节点地址同步为当前路由配置','Read guard state and recent results; sync backend chain URL with current route config')],
        [z('记忆与经验','Memory & experience'),z('recall_lessons · manage_memories','recall_lessons · manage_memories'),z('查看历史经验与用户规矩、记录长期记忆；默认关闭，只影响建议顺序','View lessons and user rules, record long-term memory; off by default and suggestion-only')],
        [z('其他','Others'),z('apply_whitelist','apply_whitelist'),z('把 EnvKit 目录加进 Defender 白名单，弹 UAC 需用户点「是」','Add the EnvKit directory to Defender exclusions; prompts UAC')]
      ]),
      H3('ai-ask','可以怎么问','What to ask'),
      UL([
        z('「现在 Go / Node / MySQL 装在哪、什么版本？」→ 状态快照，不是让你去翻环境变量。','“Where are Go / Node / MySQL installed and at what versions?” → a state snapshot, not manual env checks.'),
        z('「业务库里有哪些表，各多少行？」→ db_list + db_query，只读，不改数据。','“What tables are in the business DB and how many rows?” → db_list + db_query, read-only.'),
        z('「帮我确认服务真的起来了」→ verify_environment，给三态结论而不是「我启动了」。','“Confirm the service is really up” → verify_environment, a three-state verdict instead of “I started it”.'),
        z('「上次这个错误是怎么修的？」→ recall_lessons + get_audit_log，跨会话回看轨迹。','“How did we fix this error last time?” → recall_lessons + get_audit_log, traces across sessions.'),
        z('「把这个 SQL 跑了」→ 先备份、再弹确认卡，服务端 428 兜底；取消记「未证明」不算失败。','“Run this SQL” → backup first, then a confirmation card backed by server-side 428; cancelling records “unproven”, not failure.')
      ]),
      H3('ai-gate','写操作闸门','Write gates'),
      TABLE([z('机制','Mechanism'),z('行为','Behaviour')],[
        [z('写操作确认','Write confirmation'),z('服务端返回 428 强制确认，模型跳不过去；不提供任意命令执行','Server returns 428 and the model cannot bypass it; no arbitrary command execution')],
        [z('复验三态','Three verification states'),z('通过 / 已执行未验证 / 失败；退出码 0 不算完成','Passed / executed but unverified / failed; exit code 0 is not completion')],
        [z('拖入文件','Drop a file'),z('.sql 走备份 → 确认 → 执行；docx / xlsx / pptx / pdf 由后端抽取并真分页','SQL goes backup → confirm → execute; documents are extracted back-end with real pagination')],
        [z('记忆与经验','Memory and experience'),z('默认关闭；即使开启也只影响建议顺序，不改变权限档位','Off by default; even on, they only affect suggestion order, never permission levels')]
      ]),
      NOTE('内存里没有的权限，不会因为「这条经验置信度高」而放开。任何写操作都逐条过确认。',
           'No permission is granted because an experience has high confidence. Every write still goes through confirmation.', 'ok'),
      XLINK([['verify','完成 ≠ 结论','Done ≠ verified'],['security','安全边界','Security boundary']])
    ]},

    {id:'missions', group:z('AI 与自动化','AI & automation'), title:z('行动、报表与晨报','Actions, reports and briefing'), body:[
      P('AI 抽屉的「行动」tab 把一次处置变成可持久化、可续作的行动：手动新建、定时巡检、守护降级、本机入站触发都会产出行动。断网断流或程序重启后点「继续」，从最后完成的步骤接着跑，不从头再来。',
        'The Actions tab turns a repair into a persistent, resumable action. Manual creation, scheduled checks, guard degradation and local inbound triggers all produce actions. After a network drop or restart, press Continue to resume from the last completed step.'),
      H3('missions-play','预案的养成','How playbooks grow'),
      OL([
        z('行动收口后把步骤序列存成预案；下次同类故障（同服务 + 同错误类型）由预案预填步骤。','Save the steps as a playbook once an action closes; the next same service + error type pre-fills them.'),
        z('预案预填不等于免确认：写操作照样逐条过 428。','Pre-filled steps still confirm every write through 428.'),
        z('预案连败 3 次自动进「待复审」，不再推荐。','Three consecutive failures put a playbook into review and it stops being recommended.'),
        z('「取消」记的是「未证明」，不算「修不好」，不参与失败统计。','Cancelling records “unproven”, not “unfixable”, and does not count as a failure.')
      ]),
      H3('growth-metrics','成长报表：五项指标','Growth report: five metrics'),
      P('行动 tab 下方按 ISO 周列出首次解决率、平均步数、用户修正率、预案命中率与有效率，全部从 missions.json / playbooks.json / 审计直接算出，不经模型转述。分母为 0 显示「—」而不是 0%；样本不足会明说「这个量级看不出趋势」。',
        'Below the Actions tab, first-time resolution, average steps, user corrections and playbook hit / effective rates are listed by ISO week, computed directly from missions.json / playbooks.json / audit — not narrated by a model. A zero denominator shows “—”, not 0%; small samples explicitly say “too little data for a trend”.'),
      TABLE([z('指标','Metric'),z('含义','Meaning')],[
        [z('首次解决率','First-time resolution'),z('没靠用户修正就收口的比例','Share closed without user correction')],
        [z('平均步数','Average steps'),z('一次行动平均用几步','Average step count per action')],
        [z('用户修正率','User correction rate'),z('AI 方案被用户改过的比例','Share of AI plans the user edited')],
        [z('预案命中率','Playbook hit rate'),z('预填步骤被采用的比例','Share of pre-filled steps adopted')],
        [z('预案有效率','Playbook effectiveness'),z('采用后真正收口的比例','Share of adopted playbooks that closed the action')]
      ]),
      H3('report-what','晨报','Morning report'),
      P('按设置里的时刻（默认 08:30）产出一份只读报告：服务状态、近 24 小时崩溃与熔断、磁盘趋势、未收口的行动、组件与链端状态。',
        'A read-only report is produced at the configured time (08:30 by default): service state, crashes and circuit breaks in the last 24 hours, disk trend, open actions, component and chain state.'),
      UL([
        z('全部来自系统记录，生成过程不经过模型。','All content comes from system records; the model is not involved in generating it.'),
        z('在行动列表里直接查看，或下载为 .md。','View it in the action list or download it as .md.'),
        z('全局静音会停掉主动通知，报告仍可手动打开。','Global mute stops proactive notifications; the report can still be opened manually.')
      ])
    ]},

    {id:'mobile', group:z('伴随与陪伴','Companion'), title:z('手机访问','Mobile access'), body:[
      P('个人中心打开「手机访问」后，电脑另开一个局域网端口（默认 18766）并扫码配对。桌面控制台仍只绑 127.0.0.1；手机端口上只有 12 条接口，桌面那一百多个路由在这个端口上不存在——不是"被判断成不允许"。',
        'Turn on Mobile access in the profile to open a separate LAN port (default 18766) and pair by QR code. The desktop console still binds only 127.0.0.1; the mobile port exposes just 12 endpoints — desktop routes simply do not exist there.'),
      H3('mobile-pair','配对一次，长期信任','Pair once, trust afterwards'),
      STEPS([
        z('在个人中心打开「手机访问」开关，电脑会另开一个局域网端口（默认 18766）。',
          'Turn on Mobile access in the profile; a separate LAN port opens (default 18766).'),
        z('手机连同一个 WiFi（移动数据连不上），浏览器打开配对弹窗里的访问网址。',
          'Join the same WiFi (mobile data will not work) and open the URL shown in the pairing dialog on your phone.'),
        z('输入配对码——每次启动 EnvKit 都会变，点「换一个码」旧码立刻失效。',
          'Enter the pairing code — it changes on every EnvKit start; “new code” invalidates the old one immediately.'),
        z('配对后这台手机受信任 30 天；不想要了就关开关或在配对弹窗里移除设备。',
          'The phone is then trusted for 30 days; turn the switch off or remove the device in the pairing dialog.')
      ]),
      H3('mobile-tier','三档能力','Three capability tiers'),
      TABLE([z('能力','Capability'),z('默认','Default'),z('说明','Detail')],[
        [z('看屏幕','Screen view'),z('开（只读）','On (read-only)'),z('只能看，不能操作','View only, no control')],
        [z('剪贴板','Clipboard'),z('关','Off'),z('碰用户数据，需单独开','Touches user data; separate switch')],
        [z('终端','Terminal'),z('关','Off'),z('能执行命令，危险度最高','Can execute commands; highest risk')]
      ]),
      UL([
        z('每个设备一个令牌；配对可再加一道 6 位动态验证码。','One token per device; an optional 6-digit one-time code adds a second factor.'),
        z('未配对设备连「功能开没开」都探不到：配对码与能力开关先鉴权再判断。','Unpaired devices cannot even detect whether a capability is on; authentication comes before capability checks.')
      ]),
      XLINK([['security','安全边界','Security boundary'],['troubleshoot','排障索引','Troubleshooting']])
    ]},

    {id:'pet', group:z('伴随与陪伴','Companion'), title:z('桌宠与托盘','Desktop pet and tray'), body:[
      P('右下角的大肥鱼会跟着任务换状态：待机、思考、干活、等待确认、出错；进度环显示当前任务，悬停能看到任务名与耗时。有确认卡时它会举蓝色徽标，点徽标可直接批准或拒绝。',
        'The fish changes with task state: idle, thinking, working, awaiting confirmation or error. The ring shows progress; hovering shows the task name and elapsed time. A blue badge on confirmation lets you approve or reject without opening the drawer.'),
      H3('pet-act','动作一览','Actions at a glance'),
      TABLE([z('动作','Action'),z('效果','Effect')],[
        [z('单击','Single click'),z('打开 AI 抽屉','Open the AI drawer')],
        [z('双击','Double click'),z('喂食，五种食物各有台词与动画','Feed it; five foods with their own lines')],
        [z('按住 1.5 秒','Hold 1.5 s'),z('摸头','Pet it')],
        [z('拖着甩','Drag fast'),z('它会晕','It gets dizzy')],
        [z('连点 5 / 10 / 15 次','Click 5 / 10 / 15 times'),z('回嘴 / 撒花 / 喷水','Talk back / confetti / water spray')],
        [z('右键','Right click'),z('归位、说一句、三档大小、原地 / 溜达 / 跟随、鼠标穿透、AI 抽屉、立即检测','Home, say, three sizes, still / wander / follow, click-through, AI drawer, immediate check')]
      ]),
      NOTE('天气默认关闭；在设置里开启后，右键「查看天气」给实况 / 细节 / 建议三行。开了鼠标穿透后整只鱼都不吃点击，提示气泡约 5 秒后自己收起；要恢复就刷新页面，或从托盘重新打开控制台。',
           'Weather is off by default; enable it in Settings for a three-line report. With click-through on, the pet ignores clicks and the hint bubble hides after about five seconds. Refresh the page or reopen the console from the tray to restore.', 'warn'),
      H3('settings-zone','设置与托盘','Settings and tray'),

    {id:'eval', group:z('安全与保障','Safety & assurance'), title:z('评测与故障注入','Evaluation & fault injection'), body:[
      P('仓库里有单元测试、浏览器回归，以及 11 类故障注入评测（每类 3 次真实调用），观察模型是否查了、判对了、不越权、不谎报、该复验时复验。',
        'The repository has unit tests, browser regressions and 11 categories of fault-injection evaluation (three real calls each), checking whether the model looked, judged correctly, stayed in bounds, did not misreport and re-verified when needed.'),
      H3('eval-catch','抓到过的真实缺陷','Real bugs it caught'),
      UL([
        z('备份校验"假绿"——文件存在被当成能还原','Backup “false green” — file existence treated as restorable'),
        z('大文件截断误报——截断的导出被当成完整','Large-file truncation misreport — a truncated export treated as complete'),
        z('评测装置在测旧构建——前端嵌在 exe 里，只重建前端等于没改','Evaluation testing an old build — front end is embedded in the exe, so rebuilding only the front end changes nothing')
      ]),
      H3('eval-seam','接缝测试','The seam test'),
      P('agent_loop_e2e_test.go 一条测试覆盖完整闭环：告警 → 预案 → 起草 → 执行 → 复验 → 收口 → 沉淀 → 复用 → 降级 → 经验召回，不调模型。单模块单测测不出接缝问题——历史上两次真实断链都发生在接缝上，而当时所有单测都是绿的。',
        'One test in agent_loop_e2e_test.go covers the whole loop: alert → playbook → draft → execute → verify → close → distil → reuse → degrade → recall, with no model call. Unit tests cannot see seam problems — two real breakages happened at seams while every unit test was green.'),

  function flat(x){

    // 表格按「命中的那一行」拼片段：整表拼接再截会跨行，读起来像断句。
    if(b.k === 'table'){
      var line = '';
      b.rows.forEach(function(row){
        if(line) return;
        var cells = row.map(flatLang), all = cells.join(' · '), idx = -1;
        if(!hasAll(all, terms)) return;
        cells.forEach(function(c, i){

          if(hasAll(cur.t, terms)) found.push({a:cur.a, w:'', t:cur.t});
          return;
        }
        var t = hitText(b, terms);
        if(hasAll(t, terms)) found.push({a:cur.a, w:cur.t, t:t});
      });
      if(found.length) out.push({s:s, found:found});
    });
    var html = '', n = 0, gid = 0;
    out.forEach(function(o){
      n += o.found.length;
      var g = 'hg' + (gid++);
      html += '<div class="hit-group" data-g="' + g + '">';
      o.found.forEach(function(h, i){
        // 同一节的第二条命中不再重复节名，改用小节名当标题，否则两条看起来一模一样。
        var tt = i === 0 ? v(o.s.title) : (h.w || v(o.s.title));
        var wh = i === 0 && h.w ? h.w : '';
        html += '<button class="hit' + (i >= 2 ? ' extra' : '') + '" type="button" data-go="' + h.a + '"' +
          (i >= 2 ? ' hidden' : '') + '><span class="hit-t">' +
          esc(tt) + (wh ? '<span class="hit-where">› ' + esc(wh) + '</span>' : '') +
          '</span><span class="hit-p">' + snippet(h.t, terms) + '</span></button>';
      });
      html += '</div>';
      if(o.found.length > 2)
        html += '<button class="hit-more" type="button" data-more="' + g + '">+' + (o.found.length - 2) + '</button>';
    });
    hits.innerHTML = html || '<div class="none">' + esc(tv(T.nohit)) + '</div>';
    hits.hidden = false; tree.hidden = true; clearSel();
    return n;
  }
  function filterTree(){
    var value = (q.value || '').trim().toLowerCase(), terms = termsOf(value), shown = 0;
    [].forEach.call(tree.querySelectorAll('.grpbox'), function(box){
      var n = 0;
      [].forEach.call(box.querySelectorAll('button[data-sec]'), function(b){
        var s = D.filter(function(x){ return x.id === b.dataset.sec; })[0];
        if(!s) return;
        var on = !terms.length || hasAll(hay(s, terms), terms);
        b.hidden = !on; if(on) n++;
      });
      box.hidden = n === 0; shown += n;
      var gc = box.querySelector('.gc'); if(gc) gc.textContent = n;
    });
    if(!shown && value) tree.insertAdjacentHTML('beforeend', '<div class="empty" data-empty>' + esc(tv(T.empty)) + '</div>');
    else { var e = tree.querySelector('[data-empty]'); if(e) e.remove(); }
    var hitN = renderHits(value);
    document.getElementById('cnt').textContent = value
      ? (hitN + ' ' + tv(T.hit)) : (shown + ' ' + tv(T.count));
  }
  function secOf(anchor){
    if(anchor.indexOf('doc-') === 0){
      var id = anchor.slice(4);
      // 合并过的小节保留旧 id 当别名，老书签 / 站外链接不会 404。
      return ALIAS[id] || id;
    }
    for(var i = 0; i < D.length; i++){
      var b = D[i].body;
      for(var j = 0; j < b.length; j++){
        if(b[j].k === 'h3' && 's-' + b[j].id === anchor) return D[i].id;
      }
    }
    return '';
  }
  /* 唯一跳转入口：先判定锚点属于哪一节，必要时换页，再滚到页内锚点。
     换页后的第一次定位直接跳，平滑动画会让人以为页面卡住。 */
  function go(anchor, opts){
    opts = opts || {};
    var sec = secOf(anchor);
    if(!sec || docIdx(sec) < 0) return false;
    var same = sec === cur;
    if(!same) renderPage(sec);
    var target = anchor.indexOf('doc-') === 0 ? null : document.getElementById(anchor);
    if(target) window.scrollTo({ top:target.getBoundingClientRect().top + window.scrollY - 14,
      behavior: same ? 'smooth' : 'instant' });
    else window.scrollTo({ top:0, behavior:'instant' });
    mark(sec, anchor);
    if(!opts.silent){
      try{ opts.replace ? history.replaceState(null, '', '#' + anchor)
                        : history.pushState(null, '', '#' + anchor); }catch(_){}
    }
    return true;
  }
  function setProgress(i){
    // 分页之后「滚动进度」不再有意义，改成「读到第几节」。
    prog.style.width = ((i + 1) / D.length * 100).toFixed(2) + '%';
  }
  function keepTocInView(a){
    var br = toc.getBoundingClientRect(), ar = a.getBoundingClientRect();
    if(ar.top < br.top + 4) toc.scrollTop -= (br.top + 4 - ar.top);
    else if(ar.bottom > br.bottom - 4) toc.scrollTop += (ar.bottom - (br.bottom - 4));
  }
  function mark(id, anchor){
    [].forEach.call(tree.querySelectorAll('button[data-sec]'), function(b){
      b.classList.toggle('on', b.dataset.sec === id); });
    var on = null;
    [].forEach.call(toc.querySelectorAll('a[data-anchor]'), function(a){
      var hit = a.dataset.anchor === (anchor || 'doc-' + id);
      a.classList.toggle('on', hit); if(hit) on = a;
    });
    if(on) keepTocInView(on);
  }
  function onScroll(){
    totop.classList.toggle('show', window.scrollY > 500);
    var s = D[docIdx(cur)], anchor = '';
    if(s){
      var best = -1e9;
      s.body.forEach(function(b){
        if(b.k !== 'h3') return;
        var e = document.getElementById('s-' + b.id);
        if(e){ var t = e.getBoundingClientRect().top;
          // 取「已滚过且最靠下」的那个：t 越大越贴近视口顶部。
          if(t <= 120 && t > best){ best = t; anchor = 's-' + b.id; } }
      });
    }
    if(cur) mark(cur, anchor);
  }
  /* 明暗主题：和主控制台共用 localStorage 的 ek-theme，切一处两处同步。
     配色全部走 CSS 变量，body[data-theme=dark] 覆盖，打印时强制回亮色。 */
  var theme = 'light';
  try { theme = localStorage.getItem('ek-theme') === 'dark' ? 'dark' : 'light'; } catch(e){}
  /* 图标与首屏 ob-theme 同一套：亮色显示「点它会变暗」的月亮，暗色显示太阳。
     按钮上没有文字，语义全靠 title / aria-label，屏幕阅读器也能读。 */
  var ICON_MOON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 1.9a6.3 6.3 0 0 0 7.7 7.7A6.6 6.6 0 1 1 6.4 1.9Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.3v1.5M8 13.2v1.5M1.3 8h1.5M13.2 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  function syncThemeBtn(){
    var tb = document.getElementById('theme');
    tb.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
    var tt = tv(theme === 'dark' ? T.switchLight : T.switchDark);
    tb.title = tt; tb.setAttribute('aria-label', tt);
  }
  function setTheme(m, save){
    theme = m === 'dark' ? 'dark' : 'light';
    document.body.dataset.theme = theme;
    document.querySelector('meta[name="color-scheme"]').content = theme === 'dark' ? 'dark' : 'light';
    if(save){ try{ localStorage.setItem('ek-theme', theme); }catch(e){} }
    syncThemeBtn();
  }
  setTheme(theme, false);
  document.getElementById('theme').addEventListener('click', function(){
    setTheme(theme === 'dark' ? 'light' : 'dark', true);
  });
  function setLang(l, save){
    lang = l === 'en' ? 'en' : 'zh';
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    if(save){ try{ localStorage.setItem('ek-lang', lang); }catch(e){} }
    var b = document.getElementById('lang');
    // 按钮写的是「点了会变成的语言」：英文模式下要让读者一眼看到「中文」。
    b.textContent = lang === 'en' ? tv(T.en) : tv(T.zh);
    b.title = lang === 'en' ? 'Switch to Chinese' : 'Switch to English';
    document.title = lang === 'en' ? 'EnvKit · Docs' : 'EnvKit · 使用文档';
    document.getElementById('hero-t').textContent = tv(T.brandTitle);
    document.getElementById('hero-p').textContent = tv(T.brandSub);
    document.getElementById('cta').textContent = tv(T.backCta);
    syncThemeBtn();
    document.getElementById('lead-t').textContent = tv(T.lead);
    document.getElementById('lead-p').textContent = tv(T.leadp);
    document.getElementById('toc-btn-t').textContent = tv(T.tocBtn);
    q.placeholder = lang === 'en' ? 'Search docs (press /)' : '搜索文档（按 / 聚焦）';
    document.getElementById('replay').textContent = lang === 'en' ? 'Replay the tour →' : '重新观看界面导览 →';
    renderTree();
    // 切语言要把当前这节整页重画；再按 hash 定位一次，免得从页中间跳回顶部。
    renderPage(cur || D[0].id);
    var hash = (location.hash || '').replace(/^#/, '');
    if(hash && secOf(hash)) go(hash, {silent:true});
  }

  tree.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('button[data-sec]');
    if(b){ go('doc-' + b.dataset.sec); closeDrawer(); }
  });
  /* 手机端目录抽屉：按钮/遮罩/Esc 三处都能收起，选中一节后自动收起。
     .open 与遮罩的 hidden 一起切换，键盘 Also 可表达展开态给读屏。 */
  var side = document.querySelector('.side');
  var tocMask = document.getElementById('toc-mask');
  var tocBtn = document.getElementById('toc-btn');
  function openDrawer(){
    if(!side) return;
    side.classList.add('open');
    tocBtn.setAttribute('aria-expanded', 'true');
    tocMask.hidden = false;
  }
  function closeDrawer(){
    if(!side) return;
    side.classList.remove('open');
    tocBtn.setAttribute('aria-expanded', 'false');
    tocMask.hidden = true;
  }
  tocBtn.addEventListener('click', function(){
    if(side.classList.contains('open')) closeDrawer(); else openDrawer();
  });
  tocMask.addEventListener('click', closeDrawer);
  q.addEventListener('input', filterTree);
  var sel = -1;
  function hitsList(){ return [].slice.call(hits.querySelectorAll('.hit:not([hidden])')); }
  function clearSel(){
    sel = -1;
    [].forEach.call(hits.querySelectorAll('.hit.sel'), function(el){ el.classList.remove('sel'); });
  }
  function markSel(i){
    var list = hitsList();
    if(!list.length){ clearSel(); return; }
    sel = (i + list.length) % list.length;
    list.forEach(function(el, k){ el.classList.toggle('sel', k === sel); });
    list[sel].scrollIntoView({block:'nearest'});
  }
  /* 命中项点走之后搜索就完成使命：清掉关键词、收起命中列表、把左目录放回来。
     否则读者得手动去搜索框删字才能继续浏览——这是把「搜索完成」的清理推给用户。 */
  function clearSearch(){
    if(!(q.value || '')) return;
    q.value = '';
    filterTree();
  }
  hits.addEventListener('click', function(e){
    var more = e.target.closest && e.target.closest('.hit-more');
    if(more){
      var g = document.querySelector('.hit-group[data-g="' + more.dataset.more + '"]');
      if(g) [].forEach.call(g.querySelectorAll('.hit.extra'), function(el){ el.hidden = false; });
      more.hidden = true; clearSel();
      return;
    }
    var b = e.target.closest && e.target.closest('.hit:not([hidden])');
    if(b){ go(b.dataset.go); clearSearch(); }
  });
  /* 页内所有指向 #锚点 的链接（右目录、快速跳转、交叉链接、上下篇）走同一个入口，
     行为一致，也省得每处各写一遍 preventDefault。 */
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if(!a) return;
    var href = a.getAttribute('href') || '';
    if(href.length < 2) return;
    e.preventDefault();
    go(href.slice(1));
  });
  /* 复制的是「带锚点的完整地址」，不是页内 #；粘贴给别人能直接落在这一节。 */
  function share(id){
    var url = location.href.split('#')[0] + '#' + id;
    try{ history.replaceState(null, '', '#' + id); }catch(_){}
    var btn = body.querySelector('[data-lk="' + id + '"]');
    var beat = function(){
      if(!btn) return;
      btn.classList.add('done'); btn.textContent = '✓';
      setTimeout(function(){ btn.classList.remove('done'); btn.textContent = '#'; }, 1400);
    };
    var put = function(){
      try{
        var ta = document.createElement('textarea');
        ta.value = url; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); ta.remove();
        if(ok){ beat(); flash(tv(T.copiedLink)); }
        else { flash(url); }
      }catch(_){ flash(url); }
    };
    // 剪贴板是异步的，先给按钮反馈再等结果：等结果回来才变，用户会以为没生效。
    beat();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ flash(tv(T.copiedLink)); }, put);
    } else put();
  }
  body.addEventListener('click', function(e){
    var t = e.target;
    var lk = t.closest && t.closest('.lk');
    if(lk){ share(lk.dataset.lk); return; }
    if(t.closest && t.closest('#print-one')){
      document.body.classList.add('print-one');
      setTimeout(function(){ window.print(); document.body.classList.remove('print-one'); }, 30);
      return;
    }
    var b = t.closest && t.closest('.cp');
    if(!b) return;
    var pre = b.parentNode.querySelector('pre'), s = pre ? pre.textContent : '';
    var done = function(){ b.textContent = tv(T.copied); setTimeout(function(){ b.textContent = tv(T.copy); }, 1200); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, done);
      else { var ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove(); done(); }
    }catch(_){ done(); }
  });
  totop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
  document.getElementById('lang').addEventListener('click', function(){ setLang(lang === 'en' ? 'zh' : 'en', true); });
  document.addEventListener('keydown', function(e){
    if(e.isComposing) return;
    var typing = /^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || '');
    if((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){
      e.preventDefault(); q.focus(); q.select();
    } else if(e.key === 'Escape'){
      if(side && side.classList.contains('open')) closeDrawer();
      if(document.activeElement === q){ q.blur(); clearSel(); }
    }
    else if((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !hits.hidden &&
            (document.activeElement === q || hits.contains(document.activeElement)) && hitsList().length){
      e.preventDefault(); markSel(sel + (e.key === 'ArrowDown' ? 1 : -1));
    } else if(e.key === 'Enter' && document.activeElement === q && !hits.hidden && hitsList().length){
      e.preventDefault(); go(hitsList()[sel >= 0 ? sel : 0].dataset.go); clearSearch();
    }
  });
  window.addEventListener('scroll', onScroll, {passive:true});
  /* 地址栏改 hash、浏览器前进 / 后退都走这里。点击时自己调 go 并 pushState，
     而 pushState 不发 hashchange，所以这里只兜底外部改动。 */
  function route(){
    var a = (location.hash || '').replace(/^#/, '');
    if(a && secOf(a)) go(a, {silent:true});
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
  window.addEventListener('storage', function(e){
    if(e.key === 'ek-lang' && e.newValue) setLang(e.newValue, false);
    else if(e.key === 'ek-theme' && e.newValue) setTheme(e.newValue, false);
  });
  setLang(lang, false);
  onScroll();
  // 首屏没有 hash 时补一个：地址栏随时可分享，后退也有落点。
  if(!secOf((location.hash || '').replace(/^#/, ''))){
    try{ history.replaceState(null, '', '#doc-' + D[0].id); }catch(_){}
  }
  /* 浏览器会按地址栏 hash 自己滚一次，而正文只渲染了一节，它把 h2 顶到视口顶部，
     结果封面被推出屏幕。load 之后按同一套规则再定位一次。 */
  window.addEventListener('load', route);
  setTimeout(route, 160);
})();
</script>
</body>
</html>
